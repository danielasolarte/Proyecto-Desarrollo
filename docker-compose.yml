services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mooc
      POSTGRES_PASSWORD: mooc
      POSTGRES_DB: mooc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mooc
      MINIO_ROOT_PASSWORD: mooc12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

volumes:
  pgdata:
  miniodata:
