version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Esta variable fuerza a MinIO a firmar las URLs apuntando a localhost o al dominio público
      MINIO_SERVER_URL: "${MINIO_PUBLIC_URL:-http://localhost:9000}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contenedor de un solo uso: crea el bucket donde vive todo lo del
  # módulo de multimedia (originales, HLS, PDFs convertidos) apenas MinIO
  # está listo, y le pone política de lectura pública a las URLs firmadas
  # de descarga. Corre una vez y termina (no es un servicio de larga vida).
  minio-init:
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET}
      "

  mailpit:
    image: axllent/mailpit
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      # Host publico que queda firmado en las URLs de subida/descarga que
      # recibe el navegador/Postman -- "minio:9000" solo resuelve DENTRO
      # de la red de docker-compose, por eso no sirve para un cliente que
      # corre en la maquina host. Ver internal/media/platform/s3storage.go.
      S3_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HTTP_PORT: "8080"

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      WORKER_WORKDIR: /tmp/media
    deploy:
      replicas: 1

volumes:
  pgdata:
  miniodata:
  clamavdata: