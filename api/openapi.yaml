openapi: 3.1.0
info:
  title: Plataforma MOOC — Cursos, Autoría y Catálogo
  description: >
    Endpoints del módulo de cursos, autoría y catálogo (Persona 1 / Persona B).
    Documenta solo esta parte de la API; los demás módulos (identidad,
    multimedia, quizzes, progreso) agregan sus propios paths a este mismo
    documento cuando se integren.
  version: "0.1.0"
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /auth/register:
    post:
      summary: Registro publico de estudiantes con envio de verificacion por Mailpit
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Estudiante creado en pending_verification }
        "409": { description: Email ya registrado }

  /auth/bootstrap-admin:
    post:
      summary: Crear el primer administrador solo si no existe ningun admin activo
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Administrador inicial creado }
        "409": { description: Ya existe un administrador activo }

  /auth/verify-email:
    post:
      summary: Verificar correo con token enviado a Mailpit
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Usuario activado }
        "400": { description: Token invalido o expirado }

  /auth/login:
    post:
      summary: Login con sesion opaca revocable guardada en Redis y Postgres
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Token de sesion y datos del usuario }
        "401": { description: Credenciales invalidas }

  /auth/logout:
    post:
      summary: Revocar la sesion actual
      tags: [identidad]
      responses:
        "204": { description: Sesion revocada }

  /auth/password/forgot:
    post:
      summary: Solicitar token de recuperacion de clave por Mailpit
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Solicitud aceptada sin revelar si el email existe }

  /auth/password/reset:
    post:
      summary: Cambiar clave usando token de recuperacion
      tags: [identidad]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: Clave cambiada }

  /me:
    get:
      summary: Obtener el usuario autenticado
      tags: [identidad]
      responses:
        "200": { description: Usuario actual }

  /admin/users:
    get:
      summary: Listar usuarios
      tags: [administracion]
      responses:
        "200": { description: Usuarios activos/no eliminados }

  /admin/users/admins:
    post:
      summary: Crear administrador desde administracion
      tags: [administracion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Administrador activo creado }

  /admin/users/teachers:
    post:
      summary: Crear profesor desde administracion
      tags: [administracion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Profesor activo creado }

  /admin/users/{userID}:
    get:
      summary: Obtener un usuario por ID
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200": { description: Usuario encontrado }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Cambiar nombre, rol o estado de un usuario
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                role: { type: string, enum: [student, teacher, admin] }
                status: { type: string, enum: [pending_verification, active, suspended, deleted] }
      responses:
        "200": { description: Usuario actualizado }
        "409": { description: Proteccion del ultimo administrador activo }
    delete:
      summary: Marcar usuario como deleted
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204": { description: Usuario eliminado logicamente }

  /admin/users/{userID}/sessions:
    get:
      summary: Listar sesiones de un usuario
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200": { description: Sesiones del usuario }
    delete:
      summary: Revocar todas las sesiones de un usuario
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204": { description: Sesiones revocadas }

  /admin/sessions/{sessionID}:
    delete:
      summary: Revocar una sesion desde administracion
      tags: [administracion]
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204": { description: Sesion revocada }

  /admin/audit-log:
    get:
      summary: Consultar auditoria reciente
      tags: [administracion]
      responses:
        "200": { description: Eventos de auditoria }

  /courses:
    post:
      summary: Crear un curso nuevo (crea también su primera versión en borrador)
      tags: [autoria]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                summary: { type: string }
                category: { type: string }
      responses:
        "201":
          description: Curso y primera versión creados
        "400":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseID}:
    get:
      summary: Obtener metadatos de un curso
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "200": { description: Curso encontrado }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses/{courseID}/preview:
    get:
      summary: Previsualizar el árbol de la versión draft (o publicada si no hay draft)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "200":
          description: Árbol completo más la lista de problemas de publicación (vacía si ya se puede publicar)

  /courses/{courseID}/draft:
    post:
      summary: >
        Crear un borrador de actualización a partir de la versión publicada
        (opcional: borradores de actualización con clasificación de cambios)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [change_type]
              properties:
                change_type: { type: string, enum: [minor, major] }
      responses:
        "201": { description: Nueva versión draft creada, copiando la estructura publicada }
        "409": { description: El curso ya tiene un borrador en curso }

  /courses/{courseID}/publish:
    post:
      summary: Publicar la versión draft del curso (queda inmutable)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "200": { description: Versión publicada }
        "400": { $ref: "#/components/responses/ValidationError" }

  /versions/{versionID}:
    patch:
      summary: Editar metadatos de una versión en borrador (título, resumen, categoría)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200": { description: Versión actualizada }
        "423": { description: La versión ya fue publicada y es inmutable }

  /versions/{versionID}/modules:
    post:
      summary: Crear un módulo dentro de una versión en borrador
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "201": { description: Módulo creado }

  /modules/{moduleID}:
    patch:
      summary: Editar un módulo (título, posición)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/ModuleID"
      responses:
        "200": { description: Módulo actualizado }
    delete:
      summary: Eliminar un módulo
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/ModuleID"
      responses:
        "204": { description: Eliminado }

  /modules/{moduleID}/units:
    post:
      summary: Crear una unidad dentro de un módulo
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/ModuleID"
      responses:
        "201": { description: Unidad creada }

  /units/{unitID}:
    patch:
      summary: Editar una unidad (título, posición)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/UnitID"
      responses:
        "200": { description: Unidad actualizada }
    delete:
      summary: Eliminar una unidad
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/UnitID"
      responses:
        "204": { description: Eliminada }

  /units/{unitID}/resources:
    post:
      summary: Crear un recurso dentro de una unidad
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/UnitID"
      responses:
        "201": { description: Recurso creado }

  /resources/{resourceID}:
    patch:
      summary: Editar metadatos de un recurso (título, visibilidad, obligatoriedad, posición)
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200": { description: Recurso actualizado }
    delete:
      summary: Eliminar un recurso
      tags: [autoria]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204": { description: Eliminado }

  /resources/{resourceID}/content/draft:
    put:
      summary: Autosave del contenido Markdown de un recurso rich_text
      tags: [editor]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                markdown: { type: string }
      responses:
        "200": { description: Borrador guardado }
    get:
      summary: Recuperar el último borrador autosaved
      tags: [editor]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200": { description: Contenido del borrador }

  /resources/{resourceID}/content/publish:
    post:
      summary: Mover el borrador autosaved a contenido oficial dentro de la versión en edición
      tags: [editor]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200": { description: Contenido publicado dentro del borrador }

  /catalog:
    get:
      summary: Buscar cursos publicados, con filtros y paginación por cursor
      tags: [catalogo]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200": { description: Lista de cursos publicados más el cursor de la siguiente página }

  /courses/{courseID}/enrollments:
    post:
      summary: Inscribirse a un curso publicado (o reactivar una inscripción retirada)
      tags: [catalogo]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "201": { description: Inscripción activa }
        "409": { description: Ya estaba inscrito }
    delete:
      summary: Retirarse de un curso (conserva el historial de la inscripción)
      tags: [catalogo]
      parameters:
        - $ref: "#/components/parameters/CourseID"
      responses:
        "204": { description: Retirado }

  /me/enrollments:
    get:
      summary: Listar mis inscripciones (estudiante autenticado)
      tags: [catalogo]
      responses:
        "200": { description: Lista de inscripciones }

  /resources/{resourceID}/uploads/initiate:
    post:
      summary: >
        Abrir una carga multipart reanudable. NO devuelve una URL de
        subida: el cliente pide la URL de cada parte por separado (ver
        /uploads/{uploadSessionID}/parts/{partNumber}/url) para poder
        reanudar tras una interrupción.
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitiateUploadRequest" }
      responses:
        "201":
          description: Sesión de carga multipart abierta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitiateUploadResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: No eres el profesor dueño del curso }
        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/{uploadSessionID}/parts/{partNumber}/url:
    get:
      summary: Obtener la URL prefirmada para subir una parte específica
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
        - name: partNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: URL prefirmada para esa parte
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        "403": { description: No eres quien inició esta carga }
        "409": { description: La sesión ya no está activa o expiró }

  /uploads/{uploadSessionID}/parts:
    get:
      summary: >
        Listar las partes que ya llegaron completas al bucket. Es lo que
        el cliente usa para reanudar: compara esta lista contra las
        partes que necesita y solo vuelve a subir las que faltan.
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Partes confirmadas hasta el momento
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items: { $ref: "#/components/schemas/UploadedPart" }

  /uploads/{uploadSessionID}/complete:
    post:
      summary: >
        Confirmar que la carga terminó: verifica integridad (checksum,
        tamaño), cierra la sesión y encola el primer trabajo de
        procesamiento (antivirus). Idempotente: una doble entrega para la
        misma sesión no crea un segundo job.
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Carga confirmada; devuelve el media_asset creado o actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { description: "El archivo no llegó al bucket, o el checksum no coincide" }
        "403": { description: No eres quien inició esta carga }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: La sesión de carga ya no está activa }

  /resources/{resourceID}/media:
    get:
      summary: Consultar el estado de procesamiento del asset multimedia de un recurso
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Asset multimedia encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /resources/{resourceID}/playback:
    get:
      summary: >
        Obtener una URL prefirmada de lectura para reproducir/descargar el
        recurso ya procesado (manifest HLS para video/audio, PDF para
        pdf/presentation). El control de inscripción se aplica en el
        módulo de catálogo antes de llegar aquí.
      tags: [multimedia]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: URL de reproducción/descarga, válida por tiempo limitado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackURLResponse" }
        "404": { description: "El asset todavia no existe o no ha terminado de procesarse" }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: >
        Token opaco de sesion emitido por /auth/login. Tambien se acepta
        Authorization: Bearer <token>.
  parameters:
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionID:
      name: versionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleID:
      name: moduleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitID:
      name: unitID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceID:
      name: resourceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadSessionID:
      name: uploadSessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    InitiateUploadRequest:
      type: object
      required: [mime_type]
      properties:
        mime_type: { type: string, example: "video/mp4" }
        size_bytes: { type: integer, format: int64 }
        checksum_sha256:
          type: string
          description: Checksum declarado por el cliente, se contrasta al completar la carga

    InitiateUploadResponse:
      type: object
      properties:
        upload_session: { $ref: "#/components/schemas/UploadSession" }
        recommended_part_bytes:
          type: integer
          description: Tamaño de parte sugerido para trocear el archivo (8MB)

    UploadedPart:
      type: object
      properties:
        part_number: { type: integer }
        etag: { type: string }
        size_bytes: { type: integer, format: int64 }

    UploadSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        initiated_by: { type: string, format: uuid }
        status: { type: string, enum: [initiated, uploading, completed, aborted, expired] }
        expected_mime_type: { type: string }
        expected_size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    MediaAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, audio, pdf, presentation, file] }
        original_mime_type: { type: string }
        original_size_bytes: { type: integer, format: int64 }
        duration_seconds:
          type: integer
          description: Solo para video/audio
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlaybackURLResponse:
      type: object
      properties:
        url:
          type: string
          description: URL prefirmada de lectura, expira en 15 minutos

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        status: { type: string, enum: [pending_verification, active, suspended, deleted] }
        email_verified_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        revoked_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        metadata: { type: string }
        created_at: { type: string, format: date-time }
    AuthResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        session: { $ref: "#/components/schemas/Session" }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
