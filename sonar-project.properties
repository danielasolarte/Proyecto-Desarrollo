# SonarQube Cloud (Entrega 3). Lo usa el paso "SonarQube Cloud" del job
# backend-ci en .github/workflows/ci.yml. El token va en el secreto
# SONAR_TOKEN del repositorio, nunca en este archivo.
# Confirmar las dos claves en SonarQube Cloud: proyecto -> Information.
sonar.organization=danielasolarte
sonar.projectKey=danielasolarte_Proyecto-Desarrollo
sonar.projectName=Plataforma MOOC

# Codigo de la aplicacion: backend Go y frontend React/TypeScript.
# k6/, deploy/ y postman/ son herramientas de prueba y despliegue; quedan
# fuera para que el analisis mida el producto.
sonar.sources=cmd,internal,frontend/src
sonar.tests=cmd,internal,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/.DS_Store

# Cobertura: Go (go test -coverprofile) y frontend (Vitest con lcov), ambas
# generadas en el job backend-ci antes del analisis.
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
