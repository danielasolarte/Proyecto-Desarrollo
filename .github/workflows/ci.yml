name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mooc
          POSTGRES_PASSWORD: mooc
          POSTGRES_DB: mooc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mooc -d mooc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Normalize formatting
        run: |
          gofmt -w cmd internal

      - name: Download dependencies
        run: go mod download

      - name: Unit tests
        run: go test ./cmd/... ./internal/...

      - name: Build binaries
        run: |
          go build ./cmd/api
          go build ./cmd/worker

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Validate GCP compose files
        run: |
          cp deploy/web.env.example deploy/.env
          docker compose -f deploy/docker-compose.web.yml config --quiet
          cp deploy/worker.env.example deploy/.env
          docker compose -f deploy/docker-compose.worker.yml config --quiet
          rm deploy/.env

      - name: Secret guard
        run: |
          ! git grep -n -I -E "(BEGIN PRIVATE KEY|AIza[0-9A-Za-z_-]{20,})" -- . \
            ":(exclude)go.sum" ":(exclude)*.example" ":(exclude)docs/**" ":(exclude)k6/results/**"
