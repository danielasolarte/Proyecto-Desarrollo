name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Session and access tests
        run: npm test
      - name: Build frontend
        run: npm run build
        env:
          APP_COMMIT: ${{ github.sha }}

  backend:
    name: backend-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mooc
          POSTGRES_PASSWORD: mooc
          POSTGRES_DB: mooc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mooc -d mooc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarQube lo usa para atribuir cambios y
          # detectar codigo nuevo.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Unit tests
        run: go test -coverprofile=coverage.out ./cmd/... ./internal/...

      # Cobertura del frontend (Vitest) para SonarQube. Las rutas del lcov
      # salen relativas a frontend/ y SonarQube las resuelve desde la raiz.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text-summary
          sed -i -E 's#^SF:(src/)#SF:frontend/\1#' coverage/lcov.info

      - name: Build binaries
        run: |
          mkdir -p build
          go build -o build/mooc-api ./cmd/api
          go build -o build/mooc-worker ./cmd/worker
          go build -o build/mooc-cola-exportador ./cmd/cola-exportador

      # Analisis estatico en SonarQube Cloud (duplicacion, mantenibilidad,
      # confiabilidad, seguridad y deuda tecnica) con la cobertura de Go.
      # Configuracion en sonar-project.properties. Se omite si el secreto
      # SONAR_TOKEN no esta disponible (por ejemplo, PR desde un fork).
      - name: SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Validate GCP compose files
        run: |
          cp deploy/web.env.example deploy/.env
          docker compose -f deploy/docker-compose.web.yml config --quiet
          cp deploy/worker.env.example deploy/.env
          docker compose -f deploy/docker-compose.worker.yml config --quiet
          rm deploy/.env

      - name: Secret guard
        run: |
          ! git grep -n -I -E "(BEGIN PRIVATE KEY|AIza[0-9A-Za-z_-]{20,})" -- . \
            ":(exclude).github/workflows/ci.yml" \
            ":(exclude)go.sum" ":(exclude)*.example" ":(exclude)docs/**" ":(exclude)k6/results/**"
