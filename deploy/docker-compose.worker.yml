# Worker Server: workers en Go + Redis (cola asynq y sesiones) + ClamAV.
services:
  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  redisdata:
  clamavdata: